<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Subham Sekhar Patnaik — GenAI Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#140F2E"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="0.5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#818CF8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#818CF8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- edges -->
    <path id="e1" d="M770 210 L860 210"/>
    <path id="e2" d="M860 210 C900 210 920 120 960 120"/>
    <path id="e3" d="M860 210 L960 210"/>
    <path id="e4" d="M860 210 C900 210 920 300 960 300"/>
    <path id="e5" d="M960 120 C1000 120 1020 210 1060 210"/>
    <path id="e6" d="M960 210 L1060 210"/>
    <path id="e7" d="M960 300 C1000 300 1020 210 1060 210"/>
    <path id="e8" d="M1060 210 L1140 210"/>
    <path id="loop" d="M1060 232 C1060 410 860 410 860 232"/>

    <!-- full routes for travelling pulses -->
    <path id="r1" d="M770 210 L860 210 C900 210 920 120 960 120 C1000 120 1020 210 1060 210 L1140 210"/>
    <path id="r2" d="M770 210 L860 210 L960 210 L1060 210 L1140 210"/>
    <path id="r3" d="M770 210 L860 210 C900 210 920 300 960 300 C1000 300 1020 210 1060 210 L1140 210"/>
  </defs>

  <style>
    .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .edge{fill:none;stroke:#818CF8;stroke-opacity:.3;stroke-width:1.6}
    .flow{fill:none;stroke:#C4B5FD;stroke-width:1.6;stroke-dasharray:4 10;animation:dash 1.6s linear infinite}
    .loopflow{fill:none;stroke:#34D399;stroke-opacity:.7;stroke-width:1.4;stroke-dasharray:3 7;animation:dash 2.4s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-28}}
    .fade{animation:rise .9s ease-out backwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .d1{animation-delay:.1s}.d2{animation-delay:.45s}.d3{animation-delay:.8s}.d4{animation-delay:1.15s}.d5{animation-delay:1.5s}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .lbl{font-size:10.5px;fill:#A5B4FC;letter-spacing:.12em}
    .node{fill:#1E1B4B;stroke:#818CF8;stroke-width:1.5}
    .io{fill:#7C3AED;stroke:#DDD6FE;stroke-width:1.5}
    .ok{fill:#064E3B;stroke:#34D399;stroke-width:1.5}
    .emoji{font-size:17px;text-anchor:middle;dominant-baseline:central}
  </style>

  <!-- background -->
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="18" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="17.5" fill="none" stroke="#4C1D95" stroke-opacity=".6"/>

  <!-- drifting particles -->
  <g fill="#C4B5FD">
    <circle cx="120" cy="380" r="1.6" opacity=".5"><animate attributeName="cy" values="380;340;380" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="60" r="1.2" opacity=".4"><animate attributeName="cy" values="60;90;60" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="350" r="1.8" opacity=".35"><animate attributeName="cy" values="350;310;350" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="80" r="1.4" opacity=".45"><animate attributeName="cy" values="80;50;80" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="370" r="1.3" opacity=".4"><animate attributeName="cy" values="370;340;370" dur="10s" repeatCount="indefinite"/></circle>
  </g>

  <!-- terminal chrome -->
  <g>
    <circle cx="36" cy="34" r="5.5" fill="#F87171"/>
    <circle cx="54" cy="34" r="5.5" fill="#FBBF24"/>
    <circle cx="72" cy="34" r="5.5" fill="#34D399"/>
    <text x="92" y="38" class="mono" font-size="12" fill="#8B949E">subham@genai: ~/agents</text>
  </g>

  <!-- left: identity -->
  <g class="fade d1"><text x="70" y="128" class="mono" font-size="15" fill="#A78BFA">$ subham --init --mode=agentic<tspan class="cursor" fill="#E9D5FF"> ▍</tspan></text></g>
  <g class="fade d2"><text x="68" y="196" class="sans" font-size="54" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">Subham Sekhar Patnaik</text></g>
  <g class="fade d3"><text x="70" y="240" class="sans" font-size="25" font-weight="600" fill="#E9D5FF">GenAI Engineer <tspan fill="#7C3AED">/</tspan> Agentic Systems Builder</text></g>
  <g class="fade d4"><text x="70" y="278" class="mono" font-size="14.5" fill="#A5B4FC">AI Agents · RAG · LangGraph · Tool Calling · FastAPI · AWS</text></g>
  <g class="fade d5">
    <rect x="70" y="304" width="292" height="34" rx="17" fill="#064E3B" fill-opacity=".55" stroke="#34D399" stroke-opacity=".6"/>
    <circle cx="92" cy="321" r="5" fill="#34D399"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="92" cy="321" r="5" fill="none" stroke="#34D399"><animate attributeName="r" values="5;12" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="108" y="326" class="mono" font-size="13" fill="#D1FAE5">status: shipping real systems</text>
  </g>

  <!-- right: live agent graph -->
  <g>
    <use href="#e1" class="edge"/><use href="#e2" class="edge"/><use href="#e3" class="edge"/><use href="#e4" class="edge"/>
    <use href="#e5" class="edge"/><use href="#e6" class="edge"/><use href="#e7" class="edge"/><use href="#e8" class="edge"/>
    <use href="#e1" class="flow"/><use href="#e2" class="flow"/><use href="#e3" class="flow"/><use href="#e4" class="flow"/>
    <use href="#e5" class="flow"/><use href="#e6" class="flow"/><use href="#e7" class="flow"/><use href="#e8" class="flow"/>
    <use href="#loop" class="loopflow"/>
    <text x="960" y="392" text-anchor="middle" class="mono" font-size="10.5" fill="#34D399" opacity=".85">↺ verify · re-plan</text>
  </g>

  <!-- travelling thoughts -->
  <g fill="#F5F3FF" filter="url(#soft)">
    <circle r="3.6"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath href="#r1"/></animateMotion></circle>
    <circle r="3.6"><animateMotion dur="3s" repeatCount="indefinite" begin="1s"><mpath href="#r2"/></animateMotion></circle>
    <circle r="3.6"><animateMotion dur="3s" repeatCount="indefinite" begin="2s"><mpath href="#r3"/></animateMotion></circle>
  </g>
  <circle r="3" fill="#6EE7B7" filter="url(#soft)"><animateMotion dur="2.6s" repeatCount="indefinite" begin=".5s"><mpath href="#loop"/></animateMotion></circle>

  <!-- nodes -->
  <g>
    <!-- planner pulse -->
    <circle cx="860" cy="210" r="21" fill="none" stroke="#C4B5FD"><animate attributeName="r" values="21;38" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.4s" repeatCount="indefinite"/></circle>
    <!-- verifier pulse -->
    <circle cx="1060" cy="210" r="21" fill="none" stroke="#34D399"><animate attributeName="r" values="21;38" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>

    <circle cx="770" cy="210" r="20" class="io"/><text x="770" y="211" class="emoji">🧑</text>
    <circle cx="860" cy="210" r="21" class="node"/><text x="860" y="211" class="emoji">🧩</text>
    <circle cx="960" cy="120" r="20" class="node"/><text x="960" y="121" class="emoji">🌐</text>
    <circle cx="960" cy="210" r="20" class="node"/><text x="960" y="211" class="emoji">📚</text>
    <circle cx="960" cy="300" r="20" class="node"/><text x="960" y="301" class="emoji">🔧</text>
    <circle cx="1060" cy="210" r="21" class="ok"/><text x="1060" y="211" class="emoji">✅</text>
    <circle cx="1140" cy="210" r="20" class="io"/><text x="1140" y="211" class="emoji">📦</text>

    <g class="mono lbl" text-anchor="middle">
      <text x="770" y="250">QUERY</text>
      <text x="860" y="170">PLANNER</text>
      <text x="960" y="86">RESEARCH</text>
      <text x="960" y="250">RAG</text>
      <text x="960" y="338">TOOLS</text>
      <text x="1060" y="170">VERIFIER</text>
      <text x="1140" y="250">OUTPUT</text>
    </g>
  </g>

  <!-- footer line -->
  <text x="1170" y="400" text-anchor="end" class="mono" font-size="11" fill="#6B7280">agentic mode: ON</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
